<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RPG Map Demo</title>
<style>
:root{--bg:#f1efe8;--fg:#2c2c2a;--panel:#fff;--line:#d3d1c7;--accent:#1d9e75;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1b19;--fg:#e8e6dc;--panel:#262624;--line:#444441;--accent:#5dcaa5}}
:root[data-theme="dark"]{--bg:#1b1b19;--fg:#e8e6dc;--panel:#262624;--line:#444441;--accent:#5dcaa5}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;gap:8px;padding:10px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
header b{font-size:16px}
button{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
button:active{background:var(--line)}
#stage{flex:1;min-height:0}
canvas{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;border:2px solid var(--line);border-radius:8px;background:#5b9a4a}
#msg{min-height:40px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px;display:flex;align-items:center}
#pad{display:none;justify-content:space-between;align-items:center}
#pad .dp{display:grid;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,48px);gap:4px}
#pad button{padding:0;font-size:18px}
#pad .up{grid-column:2}
@media (hover:none),(pointer:coarse){#pad{display:flex}}
.hint{opacity:.7}
#bt{position:fixed;inset:0;z-index:20;display:none;background:var(--bg);padding:calc(10px + env(safe-area-inset-top,0px)) 10px calc(10px + env(safe-area-inset-bottom,0px));--hpc:#c4433d;--mpc:#3a68c9;--mut:#5d667a;--gd:#d9a21b;--btn:#243a6b;--btnink:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #bt{--hpc:#e0645e;--mpc:#6f97ee;--mut:#98a2b8;--gd:#f0bd3c;--btn:#8fb0f5;--btnink:#10141f}}
:root[data-theme="dark"] #bt{--hpc:#e0645e;--mpc:#6f97ee;--mut:#98a2b8;--gd:#f0bd3c;--btn:#8fb0f5;--btnink:#10141f}
#bt.on{display:block}
#btapp{max-width:560px;height:100%;margin:0 auto;display:flex;flex-direction:column;gap:8px}
#bt .order{display:flex;gap:6px;overflow:hidden;min-height:30px;align-items:center;font-size:12px}
#bt .order span{padding:3px 9px;border-radius:99px;border:1px solid var(--line);background:var(--panel);color:var(--mut);white-space:nowrap}
#bt .order span.now{border-color:var(--gd);color:var(--fg);font-weight:600}
#bt .order span.foe{border-style:dashed}
#bt .row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#bt .row.foes{grid-template-columns:minmax(0,200px);justify-content:center}
#bt .u{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:6px;text-align:center;min-width:0;font-size:12px}
#bt .spr{width:44px;height:44px;margin:0 auto 2px}
#bt .foes .spr{width:96px;height:96px}
#bt .spr svg{display:block;width:100%;height:100%}
#bt .u b{display:block;font-size:14px}
#bt .u small{display:block;color:var(--mut)}
#bt .u.cur{border-color:var(--gd)}
#bt .u.sel{border-color:var(--btn);cursor:pointer;animation:pl 1s infinite}
#bt .u.dead{opacity:.35;filter:grayscale(1)}
#bt .u.hit{animation:sk .35s}
#bt .u.heal{animation:gl .6s}
#bt .bar{height:6px;border-radius:3px;background:var(--line);margin-top:4px;overflow:hidden}
#bt .bar i{display:block;height:100%;transition:width .35s}
#bt .hp{background:var(--hpc)}#bt .mp{background:var(--mpc)}
#bt .log{flex:1;min-height:40px;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px}
#bt .log p{margin:2px 0}#bt .log p.k{color:var(--mut)}
#bt .menu{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#bt .menu p{grid-column:1/-1;margin:0;color:var(--mut);font-size:13px}
#bt button{font-weight:600;padding:11px;border-radius:10px;border:0;background:var(--btn);color:var(--btnink)}
#bt button.alt{background:transparent;color:var(--fg);border:1px solid var(--line)}
#bt button:disabled{opacity:.4}
@keyframes sk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes gl{50%{box-shadow:0 0 0 4px var(--mpc)}}
@keyframes pl{50%{border-color:var(--gd)}}
:root:root:root #bt{--panel:rgba(24,24,30,.82);--line:#5a564d;--fg:#ece7d8;--mut:#b0ab9a;--hpc:#d9534f;--mpc:#5b8de6;--gd:#f0bd3c;--btn:#c98a3a;--btnink:#1b1208;overflow:hidden;background:radial-gradient(ellipse at 50% 30%,rgba(255,150,60,.12),transparent 55%),repeating-linear-gradient(115deg,rgba(255,255,255,.025) 0 3px,transparent 3px 14px),repeating-linear-gradient(25deg,rgba(0,0,0,.18) 0 5px,transparent 5px 22px),linear-gradient(#17171d,#23232b 60%,#2c2b2a)}
#bt::before{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 18%,rgba(255,150,50,.22),transparent 40%);animation:fl 1.4s infinite alternate ease-in-out}
#bt::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.65)),linear-gradient(90deg,transparent,rgba(150,160,190,.08),transparent);background-size:100% 100%,200% 100%;animation:fg 16s linear infinite}
#btapp{position:relative;z-index:1}
#bt .tc{position:absolute;z-index:1;top:calc(54px + env(safe-area-inset-top,0px));width:12px;height:22px;border-radius:50% 50% 50% 50%/65% 65% 35% 35%;background:radial-gradient(ellipse at 50% 70%,#fff3b0,#ffa733 55%,#d9441a);box-shadow:0 0 24px 9px rgba(255,150,50,.55);animation:fk .25s infinite alternate}
#bt .tc::after{content:'';position:absolute;left:3px;top:20px;width:6px;height:24px;background:#4a2c14}
#bt .tc.l{left:calc(50% - 150px)}#bt .tc.r{left:calc(50% + 138px)}
#bt .foes .u{background:radial-gradient(ellipse at 50% 85%,rgba(255,170,80,.2),transparent 65%),var(--panel)}
#bt .foes .spr{filter:drop-shadow(0 0 14px rgba(255,110,60,.4));animation:br 2.2s infinite ease-in-out}
#bt .log{background:rgba(14,14,18,.85)}
@keyframes fl{0%{opacity:.65}50%{opacity:1}100%{opacity:.75}}
@keyframes fk{from{transform:scale(1,1);opacity:.9}to{transform:scale(.88,1.12);opacity:1}}
@keyframes br{50%{transform:translateY(-3px) scale(1.03)}}
@keyframes fg{from{background-position:0 0,0 0}to{background-position:0 0,-200% 0}}
</style>
</head>
<body>
<header><span><b>Little Realm</b> <span class="hint">· arrows to walk · space to interact</span></span><span id="score">🪙 0 · 🎒 0</span></header>
<div id="stage"><canvas id="c" width="640" height="480"></canvas></div>
<div id="msg">Find the chests!</div>
<div id="bt"><i class="tc l"></i><i class="tc r"></i><div id="btapp"></div></div>
<div id="pad">
  <div class="dp"><button class="up" data-k="ArrowUp">▲</button><button data-k="ArrowLeft" style="grid-row:2">◀</button><button data-k="ArrowDown" style="grid-row:2">▼</button><button data-k="ArrowRight" style="grid-row:2">▶</button></div>
  <button id="act" style="width:84px;height:84px;border-radius:50%">Open</button>
</div>
<button id="reset" style="align-self:flex-start;display:none">Reset</button>
<script>
const T=32,W=20,H=15,cv=document.getElementById('c'),ctx=cv.getContext('2d');
// 0 grass, 1 tree, 2 water, 3 path
const map=[];
for(let y=0;y<H;y++){map.push([]);for(let x=0;x<W;x++)map[y].push(x==0||y==0||x==W-1||y==H-1?1:0)}
[[3,2],[4,2],[8,3],[9,3],[13,2],[2,8],[3,9],[6,12],[7,12],[16,12],[17,11],[11,6]].forEach(([x,y])=>map[y][x]=1);
for(let y=9;y<=11;y++)for(let x=12;x<=15;x++)map[y][x]=2;
for(let x=1;x<W-1;x++)if(map[7][x]==0)map[7][x]=3;
for(let y=1;y<H-1;y++)if(map[y][9]==0)map[y][9]=3;
map[H-1][9]=4;
const flowers=[];for(let i=0;i<30;i++){const x=1+Math.floor(Math.random()*(W-2)),y=1+Math.floor(Math.random()*(H-2));if(map[y][x]==0)flowers.push([x*T+Math.random()*24+4,y*T+Math.random()*24+4,['#f4c0d1','#fac775','#fff'][i%3]])}
let scene='world';
const cave=[];for(let y=0;y<H;y++){cave.push([]);for(let x=0;x<W;x++)cave[y].push(x==0||y==0||x==W-1||y==H-1?1:0)}
[[3,3],[4,3],[15,4],[16,4],[3,10],[4,11],[15,10],[14,11],[6,5],[13,5],[7,10],[12,10],[2,6],[17,7]].forEach(([x,y])=>cave[y][x]=1);
cave[0][9]=4;
const M=()=>scene=='world'?map:cave;
const trollLines=['The troll grunts. It smells like old socks and wet stone.','"ME HUNGRY. YOU LOOK CRUNCHY."','The troll scratches its belly and eyes you slowly.','A pile of gnawed bones sits at its feet. Best not to poke it.'];
const dk=document.createElement('canvas');dk.width=640;dk.height=480;const dx=dk.getContext('2d');
const chestsInit=()=>[{x:4,y:4,open:false},{x:16,y:3,open:false},{x:5,y:11,open:false},{x:17,y:7,open:false}];
let chests=chestsInit(),gold=0,items=0;
const p={x:9,y:8,px:9*T,py:8*T,dir:'down',moving:false};
const loot=[
 ()=>{const n=10+Math.floor(Math.random()*90);gold+=n;return `🪙 ${n} gold coins!`},
 ()=>{items++;return '🧪 A healing potion. Smells like cherries.'},
 ()=>{items++;return '⚔️ A rusty sword. Still pointy.'},
 ()=>{items++;return '🗝️ A mysterious old key. What does it open?'},
 ()=>{items++;return '🛡️ A wooden shield with a dent.'},
 ()=>'🕷️ Just a spider. It looks offended.',
 ()=>'👢 A single left boot. Why?',
 ()=>{items++;return '💎 A sparkling gem!'},
 ()=>{gold=Math.max(0,gold-20);return '👻 A ghost snatched 20 of your gold!'},
 ()=>{items++;return '🍖 A suspiciously fresh roast chicken.'}
];
const keys={};let cd=0,popup=null,popT=0;
const say=t=>{document.getElementById('msg').textContent=t};
const hud=()=>document.getElementById('score').textContent=`🪙 ${gold} · 🎒 ${items}`;
const blocked=(x,y)=>{if(x<0||y<0||x>=W||y>=H)return true;const m=M()[y][x];if(scene=='cave')return m==1||(!trollDead&&inTroll(x,y))||(trollDead&&y==7&&(x==9||x==10));return m==1||m==2||(x==8&&y==13)||chests.some(c=>c.x==x&&c.y==y)};
const D={ArrowUp:[0,-1,'up'],ArrowDown:[0,1,'down'],ArrowLeft:[-1,0,'left'],ArrowRight:[1,0,'right']};
function openChest(){
  if(inBattle)return;
  if(scene=='cave'&&trollDead){if(!goldOpen&&p.x>=8&&p.x<=11&&p.y>=6&&p.y<=8)openGold();else say(goldOpen?'The cave is quiet now. The troll is gone.':'Walk up to the golden chest and press space.');return}
  if(scene=='cave'){const nt=p.x>=8&&p.x<=11&&p.y>=5&&p.y<=9;if(nt){shake=12;burst(320,200,'170,230,130')}say(nt?trollLines[Math.floor(Math.random()*trollLines.length)]:'Nothing here but darkness and dripping water. The troll is watching.');return}
  const c=chests.find(c=>!c.open&&Math.abs(c.x-p.x)+Math.abs(c.y-p.y)==1);
  if(!c){say(Math.abs(p.x-8)+Math.abs(p.y-13)==1?'The sign reads: DANGER. Something big lives down there.':'Nothing to open here. Walk next to a chest and press space.');return}
  c.open=true;burst(c.x*T+16,c.y*T+10);const r=loot[Math.floor(Math.random()*loot.length)]();say(r);popup=r.split(' ')[0];popT=60;hud();
  if(chests.every(c=>c.open))setTimeout(()=>say('All chests opened! Press R to reset them.'),2200);
}
function reset(){chests=chestsInit();gold=0;items=0;trollDead=false;goldOpen=false;hud();say('Chests refilled. Go find them!')}
addEventListener('keydown',e=>{
  if(D[e.key]||e.key===' '){e.preventDefault()}
  if(e.key===' '&&!e.repeat)openChest();
  if(e.key==='r'||e.key==='R')reset();
  keys[e.key]=true});
addEventListener('keyup',e=>keys[e.key]=false);
document.querySelectorAll('[data-k]').forEach(b=>{
  const k=b.dataset.k,on=e=>{e.preventDefault();keys[k]=true},off=()=>keys[k]=false;
  b.addEventListener('pointerdown',on);['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,off))});
document.getElementById('act').addEventListener('pointerdown',e=>{e.preventDefault();openChest()});
function update(){if(inBattle)return;
  const tx=p.x*T,ty=p.y*T,s=3;
  if(p.px!=tx||p.py!=ty){p.moving=true;p.px+=Math.sign(tx-p.px)*Math.min(s,Math.abs(tx-p.px));p.py+=Math.sign(ty-p.py)*Math.min(s,Math.abs(ty-p.py));return}
  p.moving=false;if(M()[p.y][p.x]==4){go();return}
  for(const k in D){if(keys[k]){const[dx,dy,d]=D[k];p.dir=d;if(!blocked(p.x+dx,p.y+dy)){p.x+=dx;p.y+=dy}else if(scene=='cave'&&!trollDead&&inTroll(p.x+dx,p.y+dy)){Battle.start()}break}}
}
function drawWorld(t){
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const m=map[y][x],X=x*T,Y=y*T;
    ctx.fillStyle=m==3?'#d9b97a':m==2?'#4a90c9':((x+y)%2?'#5b9a4a':'#62a251');ctx.fillRect(X,Y,T,T);
    if(m==2){ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(X+6+(Math.sin(t/400+x)*3),Y+10,10,2)}
    if(m==4)door(X,Y,false);
  }
  flowers.forEach(([x,y,c])=>{const s=Math.sin(t/500+x)*1.5;ctx.fillStyle='#3d7a30';ctx.fillRect(x+1,y+3,1,4);ctx.fillStyle=c;ctx.fillRect(x+s,y,4,4);ctx.fillStyle='#fac775';ctx.fillRect(x+1+s,y+1,2,2)});
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(map[y][x]==1){const X=x*T,Y=y*T;
    ctx.fillStyle='rgba(0,0,0,.22)';ctx.beginPath();ctx.ellipse(X+22,Y+29,15,5,0,0,7);ctx.fill();ctx.fillStyle='#6b4423';ctx.fillRect(X+13,Y+20,6,10);ctx.fillStyle='#2f6b2b';ctx.beginPath();ctx.arc(X+16+Math.sin(t/900+x*2+y)*1.2,Y+14,13,0,7);ctx.fill();ctx.fillStyle='#3d8a38';ctx.beginPath();ctx.arc(X+12,Y+11,6,0,7);ctx.fill()}
  {const X=8*T,Y=13*T;ctx.fillStyle='rgba(0,0,0,.22)';ctx.beginPath();ctx.ellipse(X+17,Y+30,11,3,0,0,7);ctx.fill();ctx.fillStyle='#6b4423';ctx.fillRect(X+14,Y+14,4,16);ctx.fillStyle='#c9a05a';ctx.fillRect(X+1,Y+3,30,14);ctx.strokeStyle='#6b4423';ctx.lineWidth=1.5;ctx.strokeRect(X+1.5,Y+3.5,29,13);ctx.fillStyle='#a32d2d';ctx.font='bold 7px sans-serif';ctx.textAlign='center';ctx.fillText('DANGER',X+16,Y+13);ctx.textAlign='left'}
  chests.forEach(c=>{const X=c.x*T,Y=c.y*T;
    ctx.fillStyle='rgba(0,0,0,.2)';ctx.fillRect(X+4,Y+26,24,4);
    ctx.fillStyle='#8a5a2b';ctx.fillRect(X+5,Y+14,22,13);
    if(c.open){ctx.fillStyle='#3a2410';ctx.fillRect(X+7,Y+15,18,6);ctx.fillStyle='#a6713a';ctx.fillRect(X+5,Y+6,22,5)}
    else{ctx.fillStyle='#a6713a';ctx.fillRect(X+5,Y+8,22,8);ctx.fillStyle='#fac775';ctx.fillRect(X+14,Y+14,4,5)}
    ctx.fillStyle='#fac775';ctx.fillRect(X+5,Y+20,22,2)});
  }
function drawPlayer(t){
  const X=p.px,Y=p.py,ph=t/90,bob=p.moving?Math.abs(Math.sin(ph))*-2:Math.sin(t/500)*.6;
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(X+16,Y+28,9,3,0,0,7);ctx.fill();
  ctx.fillStyle='#378add';ctx.fillRect(X+9,Y+13+bob,14,13);
  ctx.fillStyle='#f5c9a0';ctx.fillRect(X+10,Y+3+bob,12,11);
  ctx.fillStyle='#5a3418';ctx.fillRect(X+10,Y+3+bob,12,4);
  ctx.fillStyle='#222';
  if(p.dir=='down'){ctx.fillRect(X+12,Y+9+bob,2,2);ctx.fillRect(X+18,Y+9+bob,2,2)}
  if(p.dir=='left')ctx.fillRect(X+11,Y+9+bob,2,2);
  if(p.dir=='right')ctx.fillRect(X+19,Y+9+bob,2,2);
  if(p.dir=='up'){ctx.fillStyle='#5a3418';ctx.fillRect(X+10,Y+3+bob,12,8)}
  const l1=p.moving?Math.max(0,Math.sin(ph))*-3:0,l2=p.moving?Math.max(0,-Math.sin(ph))*-3:0,as=p.moving?Math.sin(ph)*3:0,sd=p.dir=='left'?1:-1;
  ctx.fillStyle='#2a5f9e';ctx.fillRect(X+10,Y+24+l1,5,5);ctx.fillRect(X+17,Y+24+l2,5,5);ctx.fillStyle='#3d2a1a';ctx.fillRect(X+10,Y+28+l1,5,2);ctx.fillRect(X+17,Y+28+l2,5,2);
  ctx.fillStyle='#378add';ctx.fillRect(X+6,Y+15+bob+as,3,8);ctx.fillRect(X+23,Y+15+bob-as,3,8);ctx.fillStyle='#f5c9a0';ctx.fillRect(X+6,Y+22+bob+as,3,2);ctx.fillRect(X+23,Y+22+bob-as,3,2);
  ctx.fillStyle='#d85a30';ctx.fillRect(X+9,Y+13+bob,14,3);ctx.fillRect(X+16+sd*7,Y+14+bob+Math.sin(t/110)*1.5,sd*6,3);
  // prompt over nearby chest
  const near=scene=='world'&&chests.find(c=>!c.open&&Math.abs(c.x-p.x)+Math.abs(c.y-p.y)==1);
  if(near&&!p.moving){ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(near.x*T-8,near.y*T-16,48,14);ctx.fillStyle='#fff';ctx.font='10px sans-serif';ctx.fillText('SPACE',near.x*T+2,near.y*T-6)}
  if(popup&&popT>0){ctx.font='28px serif';ctx.globalAlpha=Math.min(1,popT/20);ctx.fillText(popup,X+2,Y-6-(60-popT)*.5);ctx.globalAlpha=1;popT--}
}
function go(){const toCave=scene=='world';scene=toCave?'cave':'world';const ny=toCave?1:13;p.x=9;p.y=ny;p.px=9*T;p.py=ny*T;p.dir=toCave?'down':'up';popup=null;say(toCave?'You step into a cold, dark cave. Something huge is breathing in the middle…':'Back in the sunshine.')}
function door(X,Y,lit){
  ctx.fillStyle='#5f5e5a';ctx.fillRect(X,Y+1,32,31);
  ctx.fillStyle='#888780';ctx.fillRect(X,Y+1,32,5);
  ctx.fillStyle='#444441';ctx.fillRect(X+2,Y+8,3,6);ctx.fillRect(X+27,Y+10,3,6);ctx.fillRect(X+2,Y+20,3,6);ctx.fillRect(X+27,Y+22,3,6);
  ctx.fillStyle=lit?'#bfe3a8':'#0b0b0a';ctx.beginPath();ctx.moveTo(X+6,Y+32);ctx.lineTo(X+6,Y+17);ctx.arc(X+16,Y+17,10,Math.PI,0);ctx.lineTo(X+26,Y+32);ctx.fill();
  ctx.fillStyle='#d3d1c7';ctx.fillRect(X+12,Y+1,8,6);ctx.fillStyle='#0b0b0a';ctx.fillRect(X+13,Y+3,2,2);ctx.fillRect(X+17,Y+3,2,2);
}
function drawCave(t){
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const m=cave[y][x],X=x*T,Y=y*T;
    ctx.fillStyle=m==1?'#4a4843':((x+y)%2?'#2b2b31':'#303037');ctx.fillRect(X,Y,T,T);
    if(m==1){ctx.fillStyle='#5d5b55';ctx.fillRect(X+3,Y+3,12,8);ctx.fillRect(X+16,Y+14,12,10);ctx.fillStyle='#3a3935';ctx.fillRect(X,Y+26,T,6)}
    if(m==4){ctx.save();ctx.translate(0,Y*2+T);ctx.scale(1,-1);door(X,Y,true);ctx.restore()}}
  ctx.fillStyle='#d3d1c7';[[290,300],[340,296],[300,180],[352,186]].forEach(([x,y])=>ctx.fillRect(x,y,8,3));
  const dot=(x,y,r,c)=>{ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()};
  if(trollDead){goldChest(t);return}

  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(cx,290,36,8,0,0,7);ctx.fill();
