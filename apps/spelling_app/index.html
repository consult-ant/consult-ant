<!DOCTYPE html>

<style>

</style></head>
<body>
<main id="home">
<h1>Spelling practice</h1>
<label for="nm">List name</label>
<input id="nm" placeholder="e.g. Week 12">
<label for="tx">Spellings (one per line, or separated by commas)</label>
<p style="margin:2px 0 6px;font-size:1rem">For the Match game, add a meaning after a colon, like <b>because: for the reason that</b>. Common words get a meaning filled in automatically; any word without one is left out of Match. Words with no meaning yet are <span class="legend">highlighted</span> so you know to add one.</p>
<div id="txw"><div id="hl" aria-hidden="true"></div><textarea id="tx" rows="7"></textarea></div>
<div class="row"><button id="sv">Save list</button><span id="cnt"></span></div>
<div id="saved"></div>
<h2>Practise</h2>
<div id="modes">
<button class="mode" data-m="spider">Spider<small>Join the letters up in order</small></button>
<button class="mode" data-m="box">Box<small>Write each letter in a box that fits it</small></button>
<button class="mode" data-m="match">Match<small>Pick the word that fits the meaning</small></button>
<button class="mode" data-m="test">Full test<small>Write every word on the lines</small></button>
</div>
</main>
<section id="prac" hidden>
<header><button id="bk">Back</button><div id="ct"></div></header>
<div id="dots"></div>
<div id="peek"></div>
<input id="ty" hidden autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Type the spelling">
<div id="stage"><div id="sc"><canvas id="cv"></canvas></div><div id="mc" hidden></div><div id="msg"></div></div>
<footer>
<button id="pv" aria-label="Previous word">◀</button>
<button id="sy">Say it</button><button id="pk">Peek</button><button id="ck">Check</button><button id="tg">Type it</button><button id="cl">Clear</button><button id="mk" hidden>Mark ✓</button><button id="rs" hidden>Result</button>
<button id="nx" aria-label="Next word">▶</button>
</footer>
</section>

{const c=ld('sp_cur',{name:'',text:''});$('#nm').value=c.name;$('#tx').value=c.text;chips();upd()}
