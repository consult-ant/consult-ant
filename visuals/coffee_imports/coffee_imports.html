<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Top Coffee Importing Countries 2015–2019</title><link rel="icon" type="image/svg+xml" href="../../ap-monogram-parametric-sliceFavicon.svg">
<style>
:root{--b1:#dcc4a6;--b2:#bf9f7a;--wedge:#b38a58;--ink:#6b4423;--pill:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--b1:#4a3624;--b2:#2e2118;--wedge:#3b2a1c;--ink:#e6c9a2;--pill:#f1e6d6;color-scheme:dark}}
:root[data-theme="dark"]{--b1:#4a3624;--b2:#2e2118;--wedge:#3b2a1c;--ink:#e6c9a2;--pill:#f1e6d6;color-scheme:dark}
html,body{margin:0;background:var(--b2)}
body{font-family:"Comic Sans MS","Comic Neue","Chalkboard SE",cursive}
#wrap{position:relative;max-width:820px;margin:0 auto}
svg{display:block;width:100%;height:auto}
.cell{fill:var(--c,#5f3d19);stroke:#c9a176;stroke-width:2.5;stroke-linejoin:round;cursor:pointer;transition:filter .15s}
.cell.hot{filter:brightness(1.3) saturate(1.1)}
.lbl{fill:#fff;font-weight:700;pointer-events:none;text-anchor:middle}
#pill{position:absolute;left:27%;top:90.5%;width:46%;display:flex;align-items:center;gap:6px;background:var(--pill);border-radius:22px;padding:4px 10px;box-sizing:border-box}
#pill button{border:0;background:none;color:#5f3d19;font-size:18px;min-width:30px;min-height:30px;cursor:pointer;border-radius:50%}
#pill button:hover{background:#0001}
#yr{flex:1;min-width:0;accent-color:#6b4423}
#tip{position:fixed;pointer-events:none;background:#2b1b0d;color:#fff;border:1px solid #b98a5a;border-radius:8px;padding:6px 10px;font-size:13px;line-height:1.4;opacity:0;transition:opacity .1s;z-index:5;max-width:220px}
#tip b{font-size:14px}
</style></head><body>
<div id="wrap">
<svg id="s" viewBox="0 0 800 800" role="img" aria-label="Voronoi treemap of top coffee importing countries, sized by 60-kg bags">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--b1)"/><stop offset="1" stop-color="var(--b2)"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#f3dcb8" stop-opacity=".42"/><stop offset=".75" stop-color="#f3dcb8" stop-opacity="0"/></radialGradient>
</defs>
<rect width="800" height="800" fill="url(#bg)"/>
<polygon points="0,165 215,300 0,570" fill="var(--wedge)" opacity=".85"/>
<g fill="var(--ink)" font-weight="700">
<text x="38" y="80" font-size="52">Top Coffee Importing</text>
<text x="38" y="146" font-size="52">Countries <tspan font-size="28" dx="4">from 2015 - 2019</tspan></text>
<text x="38" y="635" font-size="23">Sized by</text><text x="38" y="663" font-size="23">number of</text><text x="38" y="691" font-size="23">60-kg bags</text>
<text id="ytxt" x="700" y="655" font-size="40" text-anchor="middle">2015</text>
<text x="42" y="787" font-size="14" opacity=".85">Data: www.ico.org | Inspiration: @VisualCap</text>
<text x="750" y="787" font-size="14" opacity=".85" text-anchor="end">Ant Pulley | @consult_ant</text>
</g>
<g transform="translate(400,455)">
<line x1="-288" y1="-212" x2="-205" y2="-155" stroke="#0003" stroke-width="30" stroke-linecap="round"/>
<line x1="-290" y1="-214" x2="-205" y2="-157" stroke="#fff" stroke-width="24" stroke-linecap="round"/>
<circle r="248" fill="none" stroke="#0002" stroke-width="30" transform="translate(3,4)"/>
<circle r="235" fill="#4a2f12"/>
<g id="cells"></g>
<circle r="235" fill="url(#glow)" pointer-events="none"/>
<circle r="246" fill="none" stroke="#fff" stroke-width="24" pointer-events="none"/>
<g id="labels"></g>
</g>
</svg>
<div id="pill"><button id="prev" aria-label="Previous year">&#9664;</button><button id="play" aria-label="Play or pause">&#10074;&#10074;</button><button id="next" aria-label="Next year">&#9654;</button><input id="yr" type="range" min="2015" max="2019" step="1" value="2015" aria-label="Year"></div>
</div>
<div id="tip"></div>
<script>
const D={"names":["Austria","Belgium","Bulgaria","Croatia","Cyprus","Czechia","Denmark","Estonia","Finland","France","Germany","Greece","Hungary","Ireland","Italy","Latvia","Lithuania","Luxembourg","Malta","Netherlands","Poland","Portugal","Romania","Slovakia","Slovenia","Spain","Sweden","Japan","Norway","Russian Federation","Switzerland","Tunisia","United Kingdom","United States of America"],"vals":[[1513.4,5533.5,681.8,437.2,89.3,2067.8,840.8,126.2,1320.8,6808.6,21316.2,1210.0,714.2,356.6,9328.2,201.6,427.8,376.2,16.3,4176.2,3665.6,1043.9,1011.6,910.4,271.8,5428.6,2120.6,8063.4,799.7,4710.0,2747.9,458.7,4895.4,27707.7],[1494.9,6052.2,779.2,478.7,93.2,1779.4,905.8,134.8,1389.0,6737.8,22368.4,1583.7,725.4,402.6,10224.2,231.3,499.3,394.3,18.5,4781.5,3827.2,1128.5,1133.7,906.2,322.9,5660.1,2349.9,8026.2,799.1,5232.9,2816.0,465.6,5052.3,28837.8],[1459.9,5677.4,706.9,439.1,99.9,1507.0,852.2,133.1,1360.0,6966.5,21764.8,867.1,721.6,426.9,10020.3,228.9,432.5,379.9,16.8,5067.7,3999.3,1094.0,1154.6,723.1,401.4,5414.2,2306.3,7646.6,800.9,5467.8,2903.6,546.2,4989.0,29487.9],[1429.4,5742.3,737.2,445.5,133.2,1903.2,868.0,147.1,1284.8,7624.0,22147.2,1160.0,779.2,439.6,10639.4,242.7,441.5,433.3,19.4,5520.4,4325.1,1140.2,1174.1,889.5,549.7,5673.0,2262.2,7540.0,743.3,5287.5,3086.0,533.0,5687.9,28918.2],[1447.5,6198.9,784.9,466.4,133.2,1608.9,907.9,147.8,1515.5,7992.9,22431.9,1246.3,773.0,438.3,10913.8,234.9,473.6,402.3,23.4,5354.0,4452.5,1219.8,1165.1,773.5,619.5,5983.5,2347.8,8039.7,785.9,5916.6,3228.4,508.3,5554.4,30854.1]]};
const Y0=2015,Y1=2019,R=235,N=D.names.length,AREA=Math.PI*R*R;
const NS="http://www.w3.org/2000/svg",$=id=>document.getElementById(id);
// circle polygon
const CIRC=Array.from({length:140},(_,k)=>[R*Math.cos(k/140*6.2832),R*Math.sin(k/140*6.2832)]);
function clip(p,a,b,c){const o=[];for(let i=0;i<p.length;i++){const P=p[i],Q=p[(i+1)%p.length],dp=a*P[0]+b*P[1]-c,dq=a*Q[0]+b*Q[1]-c;
 if(dp<=0)o.push(P);if((dp<0&&dq>0)||(dp>0&&dq<0)){const t=dp/(dp-dq);o.push([P[0]+t*(Q[0]-P[0]),P[1]+t*(Q[1]-P[1])]);}}return o}
// targets for fractional year
function targets(t){const y=Math.min(Y1-1e-9,Math.max(Y0,t)),i=Math.floor(y)-Y0,f=y-Math.floor(y);
 const v=D.vals[i].map((a,k)=>Math.max(1,a+(D.vals[i+1][k]-a)*f)),s=v.reduce((a,b)=>a+b,0);return v.map(x=>Math.max(x/s,0.0004)*AREA*0.9996)}
// persistent power-diagram state => cells morph continuously instead of re-solving each year
const sx=new Float64Array(N),sy=new Float64Array(N),w=new Float64Array(N);let polys=[],cen=[],area=[];
{const T=targets(Y0),ord=[...T.keys()].sort((a,b)=>T[b]-T[a]);
 ord.forEach((k,r)=>{const rad=R*0.85*Math.sqrt(r/N),ang=r*2.39996;sx[k]=rad*Math.cos(ang);sy[k]=rad*Math.sin(ang);w[k]=T[k]*0.5});}
function step(T,gain,move){
 const P=[],C=[],A=[];let mw=0;
 for(let i=0;i<N;i++){let p=CIRC;const ci=sx[i]*sx[i]+sy[i]*sy[i]-w[i];
  for(let j=0;j<N&&p.length>2;j++){if(j===i)continue;p=clip(p,2*(sx[j]-sx[i]),2*(sy[j]-sy[i]),sx[j]*sx[j]+sy[j]*sy[j]-w[j]-ci);}
  let a=0,cx=0,cy=0;for(let k=0;k<p.length;k++){const u=p[k],v=p[(k+1)%p.length],cr=u[0]*v[1]-v[0]*u[1];a+=cr;cx+=(u[0]+v[0])*cr;cy+=(u[1]+v[1])*cr;}
  a/=2;P.push(p);A.push(a);if(Math.abs(a)>1e-3){C.push([cx/(6*a),cy/(6*a)]);}else C.push([sx[i],sy[i]]);}
 for(let i=0;i<N;i++){
  if(A[i]>1e-3){sx[i]+=(C[i][0]-sx[i])*move;sy[i]+=(C[i][1]-sy[i])*move;w[i]+=(T[i]-A[i])*gain;}else w[i]+=60;
  mw+=w[i];}
 mw/=N;for(let i=0;i<N;i++)w[i]-=mw;
 polys=P;cen=C;area=A;}
{const T=targets(Y0);for(let i=0;i<500;i++)step(T,0.8,0.5);}
// DOM
const cg=$("cells"),lg=$("labels"),paths=[],texts=[],tip=$("tip");
const wrap=n=>{const ws=n.split(" "),L=[];let c="";ws.forEach(x=>{if(c&&(c+" "+x).length>13){L.push(c);c=x}else c=c?c+" "+x:x});L.push(c);return L};
D.names.forEach((n,i)=>{const p=document.createElementNS(NS,"path");p.setAttribute("class","cell");{const f=x=>x%1,h=24+f(i*0.618)*10,s=38+f(i*0.382+0.2)*22,l=21+f(i*0.755+0.1)*17;p.style.setProperty("--c",`hsl(${h.toFixed(0)} ${s.toFixed(0)}% ${l.toFixed(0)}%)`);}cg.appendChild(p);paths.push(p);
 p.addEventListener("pointerenter",e=>hover(i,e));p.addEventListener("pointermove",e=>{place(e)});p.addEventListener("pointerleave",()=>hover(-1));
 const g=document.createElementNS(NS,"g"),t=document.createElementNS(NS,"text");t.setAttribute("class","lbl");const L=wrap(n);t.__L=L;
 L.forEach((s,k)=>{const ts=document.createElementNS(NS,"tspan");ts.setAttribute("x",0);ts.setAttribute("dy",k?"1.1em":(0.35-(L.length-1)*0.55)+"em");ts.textContent=s;t.appendChild(ts)});
 g.appendChild(t);lg.appendChild(g);texts.push(g);});
let hov=-1,mx=0,my=0;
function place(e){mx=e.clientX;my=e.clientY;const r=tip.getBoundingClientRect();tip.style.left=Math.min(innerWidth-r.width-8,mx+14)+"px";tip.style.top=Math.max(8,my-r.height-10)+"px"}
function hover(i,e){hov=i;paths.forEach((p,k)=>p.classList.toggle("hot",k===i));tip.style.opacity=i<0?0:1;if(e)place(e);if(i>=0)tipText()}
const fmt=x=>Math.round(x).toLocaleString("en-GB");
function tipText(){const y=Math.round(Math.min(Y1,Math.max(Y0,t))),v=D.vals[y-Y0],s=v.reduce((a,b)=>a+b,0),rk=v.filter(x=>x>v[hov]).length+1;
 tip.innerHTML=`<b>${D.names[hov]}</b><br>${fmt(v[hov])}k bags (${y})<br>${(v[hov]/s*100).toFixed(1)}% of total &middot; rank ${rk} of ${N}`;}
// time model: t eases toward target year, playing advances target
let t=Y0,target=Y0,playing=true,acc=0,last=performance.now();
const sl=$("yr"),pb=$("play");
function setTarget(y){target=Math.min(Y1,Math.max(Y0,y));sl.value=target}
function setPlay(p){playing=p;acc=0;pb.innerHTML=p?"&#10074;&#10074;":"&#9654;"}
sl.oninput=()=>{setPlay(false);target=+sl.value};
pb.onclick=()=>{if(!playing&&target>=Y1)setTarget(Y0);setPlay(!playing)};
$("prev").onclick=()=>{setPlay(false);setTarget(Math.round(target)-1)};
$("next").onclick=()=>{setPlay(false);setTarget(Math.round(target)+1)};
addEventListener("keydown",e=>{if(e.key==="ArrowLeft")$("prev").click();else if(e.key==="ArrowRight")$("next").click();else if(e.key===" "&&e.target.tagName!=="BUTTON"){e.preventDefault();pb.click()}});
const fix=x=>x.toFixed(1);
function frame(now){
 const dt=Math.min(0.05,(now-last)/1000);last=now;
 if(playing){acc+=dt;if(acc>2.4){acc=0;setTarget(target>=Y1?Y0:Math.round(target)+1)}}
 t+=(target-t)*(1-Math.exp(-dt*2.6));if(Math.abs(target-t)<1e-4)t=target;
 const T=targets(t);step(T,0.5,0.3);step(T,0.5,0.3);
 for(let i=0;i<N;i++){const p=polys[i];paths[i].setAttribute("d",p.length>2?"M"+p.map(q=>fix(q[0])+" "+fix(q[1])).join("L")+"Z":"");
  const a=Math.max(0,area[i]),L=texts[i].firstChild.__L,mx=Math.max(...L.map(s=>s.length)),fs=Math.min(15,0.8*Math.sqrt(a)/(mx*0.6),0.8*Math.sqrt(a)/(L.length*1.6));
  const g=texts[i],o=Math.max(0,Math.min(1,(fs-8)/2));g.setAttribute("opacity",o);if(o>0){g.setAttribute("transform","translate("+fix(cen[i][0])+","+fix(cen[i][1])+")");g.firstChild.setAttribute("font-size",fix(fs));}}
 $("ytxt").textContent=Math.round(t);
 if(hov>=0)tipText();
 requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script></body></html>
