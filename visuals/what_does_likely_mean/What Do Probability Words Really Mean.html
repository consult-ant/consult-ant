\"><\u002Fb>Toss-up<\u002Fspan><span><b style=\"background:#e68a52\"><\u002Fb>Unlikely<\u002Fspan><span><b style=\"background:#b4411b\"><\u002Fb>Remote<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;gap:28px;width:1088px\">\n<div style=\"width:790px\">\n<div style=\"position:relative;margin-left:190px;width:520px;height:22px;font-size:12px;color:#5b5852\"><span style=\"left:0%\">0%<\u002Fspan><span style=\"left:25%\">25%<\u002Fspan><span style=\"left:50%\">50%<\u002Fspan><span style=\"left:75%\">75%<\u002Fspan><span style=\"left:100%\">100%<\u002Fspan><\u002Fdiv>\n<div style=\"position:relative\">\n<div style=\"position:absolute;left:190px;width:520px;top:0;height:646px\"><div style=\"left:0%;\"><\u002Fdiv><div style=\"left:25%;\"><\u002Fdiv><div style=\"left:50%;border-left:1.5px dashed #8a857c\"><\u002Fdiv><div style=\"left:75%;\"><\u002Fdiv><div style=\"left:100%;\"><\u002Fdiv><\u002Fdiv>\n<div class=\"r\"><span class=\"n\">Will Happen<\u002Fspan><div class=\"t\"><i style=\"width:97.6%;background:#1b5e9b\"><\u002Fi><b style=\"left:97.6%;background:#1b5e9b\"><\u002Fb><\u002Fdiv><span class=\"v\">98%<\u002Fspan><u>4<\u002Fu><\u002Fdiv>\n<div class=\"r\"><span class=\"n\">Almost Certain<\u002Fspan><div class=\"t\"><i style=\"width:91.2%;background:#1b5e9b\"><\u002Fi><b style=\"left:91.2%;background:#1b5e9b\"><\u002Fb><\u002Fdiv><span class=\"v\">91%<\u002Fspan><u class=\"x\"><\u002Fu><\u002Fdiv>\n<div class=\"r\"><span class=\"n\">Highly Likely<\u002Fspan><div class=\"t\"><i style=\"width:88.5%;background:#1b5e9b\"><\u002Fi><b style=\"left:88.5%;background:#1b5e9b\"><\u002Fb><\u002Fdiv><span class=\"v\">88%<\u002Fspan><u class=\"x\"><\u002Fu><\u002Fdiv>\n<div class=\"r\"><span class=\"n\">Very Good Chance<\u002Fspan><div class=\"t\"><i style=\"width:81.4%;background:#1b5e9b\"><\u002Fi><b style=\"left:81.4%;background:#1b5e9b\"><\u002Fb><\u002Fdiv><span class=\"v\">81%<\u002Fspan><u class=\"x\"><\u002Fu><\u002Fdiv>\n<div class=\"r\"><span class=\"n\">Probable<\u002Fspan><div class=\"t\"><i style=\"width:77.7%;background:#6fa3d6\"><\u002Fi><b style=\"left:77.7%;background:#6fa3d6\"><\u002Fb><\u002Fdiv><span class=\"v\">78%<\u002Fspan><u>1<\u002Fu><\u002Fdiv>\n<div class=\"r\"><span class=\"n\">Likely<\u002Fspan><div class=\"t\"><i style=\"width:68.5%;background:#6fa3d6\"><\u002Fi><b style=\"left:68.5%;background:#6fa3d6\"><\u002Fb><\u002Fdiv><span class=\"v\">68%<\u002Fspan><u>1<\u002Fu><\u002Fdiv>\n<div class=\"r\"><span class=\"n\">Better than Even<\u002Fspan><div class=\"t\"><i style=\"width:66.2%;background:#6fa3d6\"><\u002Fi><b style=\"left:66.2%;background:#6fa3d6\"><\u002Fb><\u002Fdiv><span class=\"v\">66%<\u002Fspan><u class=\"x\"><\u002Fu><\u002Fdiv>\n<div class=\"r\"><span class=\"n\">Realistic Possibility<\u002Fspan><div class=\"t\"><i style=\"width:61.7%;background:#6fa3d6\"><\u002Fi><b style=\"left:61.7%;background:#6fa3d6\"><\u002Fb><\u002Fdiv><span class=\"v\">62%<\u002Fspan><u>2<\u002Fu><\u002Fdiv>\n<div class=\"r\"><span class=\"n\">About Even<\u002Fspan><div class=\"t\"><i style=\"width:50.6%;background:#d9a21b\"><\u002Fi><b style=\"left:50.6%;background:#d9a21b\"><\u002Fb><\u002Fdiv><span class=\"v\">51%<\u002Fspan><u>2<\u002Fu><\u002Fdiv>\n<div class=\"r\"><span class=\"n\">May Happen<\u002Fspan><div class=\"t\"><i style=\"width:50.3%;background:#d9a21b\"><\u002Fi><b style=\"left:50.3%;background:#d9a21b\"><\u002Fb><\u002Fdiv><span class=\"v\">50%<\u002Fspan><u class=\"x\"><\u002Fu><\u002Fdiv>\n<div class=\"r\"><span class=\"n\">Could Happen<\u002Fspan><div class=\"t\"><i style=\"width:45.9%;background:#d9a21b\"><\u002Fi><b style=\"left:45.9%;background:#d9a21b\"><\u002Fb><\u002Fdiv><span class=\"v\">46%<\u002Fspan><u class=\"x\"><\u002Fu><\u002Fdiv>\n<div class=\"r\"><span class=\"n\">Might Happen<\u002Fspan><div class=\"t\"><i style=\"width:44.7%;background:#d9a21b\"><\u002Fi><b style=\"left:44.7%;background:#d9a21b\"><\u002Fb><\u002Fdiv><span class=\"v\">45%<\u002Fspan><u>3<\u002Fu><\u002Fdiv>\n<div class=\"r\"><span class=\"n\">Unlikely<\u002Fspan><div class=\"t\"><i style=\"width:27.0%;background:#e68a52\"><\u002Fi><b style=\"left:27.0%;background:#e68a52\"><\u002Fb><\u002Fdiv><span class=\"v\">27%<\u002Fspan><u>3<\u002Fu><\u002Fdiv>\n<div class=\"r\"><span class=\"n\">Little Chance<\u002Fspan><div class=\"t\"><i style=\"width:26.7%;background:#e68a52\"><\u002Fi><b style=\"left:26.7%;background:#e68a52\"><\u002Fb><\u002Fdiv><span class=\"v\">27%<\u002Fspan><u class=\"x\"><\u002Fu><\u002Fdiv>\n<div class=\"r\"><span class=\"n\">Chances are Slight<\u002Fspan><div class=\"t\"><i style=\"width:22.6%;background:#e68a52\"><\u002Fi><b style=\"left:22.6%;background:#e68a52\"><\u002Fb><\u002Fdiv><span class=\"v\">23%<\u002Fspan><u class=\"x\"><\u002Fu><\u002Fdiv>\n<div class=\"r\"><span class=\"n\">Improbable<\u002Fspan><div class=\"t\"><i style=\"width:18.7%;background:#e68a52\"><\u002Fi><b style=\"left:18.7%;background:#e68a52\"><\u002Fb><\u002Fdiv><span class=\"v\">19%<\u002Fspan><u class=\"x\"><\u002Fu><\u002Fdiv>\n<div class=\"r\"><span class=\"n\">Highly Unlikely<\u002Fspan><div class=\"t\"><i style=\"width:16.1%;background:#e68a52\"><\u002Fi><b style=\"left:16.1%;background:#e68a52\"><\u002Fb><\u002Fdiv><span class=\"v\">16%<\u002Fspan><u class=\"x\"><\u002Fu><\u002Fdiv>\n<div class=\"r\"><span class=\"n\">Remote Chance<\u002Fspan><div class=\"t\"><i style=\"width:14.5%;background:#b4411b\"><\u002Fi><b style=\"left:14.5%;background:#b4411b\"><\u002Fb><\u002Fdiv><span class=\"v\">14%<\u002Fspan><u class=\"x\"><\u002Fu><\u002Fdiv>\n<div class=\"r\"><span class=\"n\">Almost No Chance<\u002Fspan><div class=\"t\"><i style=\"width:4.0%;background:#b4411b\"><\u002Fi><b style=\"left:4.0%;background:#b4411b\"><\u002Fb><\u002Fdiv><span class=\"v\">4%<\u002Fspan><u>4<\u002Fu><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-left:190px;width:520px;text-align:center;font-size:12.5px;color:#5b5852;margin-top:8px\">Share of matchups where the phrase was picked as the higher probability<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"width:270px;padding-top:22px\">\n<div class=\"c\"><div class=\"bg\"><u>1<\u002Fu><strong>53 / 47<\u002Fstrong><\u002Fdiv><p>“Likely” vs “Probable” is a coin flip. People treat them as the same word.<\u002Fp><\u002Fdiv>\n<div class=\"c\"><div class=\"bg\"><u>2<\u002Fu><strong>58%<\u002Fstrong><\u002Fdiv><p>of the time “Realistic Possibility” beat “About Even”. It reads as better than a toss-up.<\u002Fp><\u002Fdiv>\n<div class=\"c\"><div class=\"bg\"><u>3<\u002Fu><strong>18 pts<\u002Fstrong><\u002Fdiv><p>The biggest gap on the scale sits between “Might Happen” and “Unlikely”. Possible and unlikely are very different promises.<\u002Fp><\u002Fdiv>\n<div class=\"c\"><div class=\"bg\"><u>4<\u002Fu><strong>98% → 4%<\u002Fstrong><\u002Fdiv><p>“Will Happen” and “Almost No Chance” are the only phrases almost everyone agrees on.<\u002Fp><\u002Fdiv>\n<div class=\"c\"><div class=\"bg\"><strong>97%<\u002Fstrong><\u002Fdiv><p>of people gave the same answer when a comparison was repeated in reverse, so the signal is solid.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"position:absolute;left:56px;right:56px;bottom:36px;margin:0;font-size:12px;line-height:1.5;color:#5b5852\">Win rate ranks the phrases; it is not a literal probability. Each phrase was compared about 5,400 times, and every pair of phrases was covered (about 300 votes each).<br>#makeovermonday · Vibed by Ant Pulley · Data source: CAPphrase<\u002Fp>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:1080}}\">\nclass Component extends DCLogic {\nrenderVals() { return {}; }\n}\n<\u002Fscript>\n\n<\u002Fbody><\u002Fhtml>"
